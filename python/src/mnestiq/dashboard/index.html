<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mnestiq Dashboard</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --sunken: #f7f8fa; --hover: #f0f2f5; --select: #e8eefb;
  --line: #dfe2e7; --line-strong: #c9ced6;
  --text: #1b1f24; --muted: #59626e; --faint: #646c77;
  --accent: #1f5fd1;
  --ok: #18794e; --ok-bg: #e6f4ec; --bad: #c4321f; --bad-bg: #fcebe8; --warn: #9a5b00; --warn-bg: #fdf4e3; --untrusted: #c2410c;
  --t-llm: var(--muted); --t-tool: var(--muted); --t-egress: var(--muted); --t-approval: var(--muted); --t-run: #646c77;
  --s-system: var(--muted); --s-user: var(--muted); --s-internal: var(--muted); --s-model: var(--muted); --s-tool_output: var(--untrusted); --s-retrieved_doc: var(--untrusted);
  --s-web: var(--untrusted); --s-agent_msg: var(--untrusted); --s-memory: var(--untrusted); --s-unknown: var(--untrusted);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f12; --panel: #14171b; --sunken: #101317; --hover: #1a1e24; --select: #1a2638;
    --line: #262b33; --line-strong: #343a44;
    --text: #e3e6ea; --muted: #9aa3ae; --faint: #8a929d;
    --accent: #5b9bff;
    --ok: #4cc38a; --ok-bg: #11291d; --bad: #ff6b57; --bad-bg: #331512; --warn: #f0b13c; --warn-bg: #2e2210; --untrusted: #fb923c;
    --t-llm: var(--muted); --t-tool: var(--muted); --t-egress: var(--muted); --t-approval: var(--muted); --t-run: #8a929d;
    --s-system: var(--muted); --s-user: var(--muted); --s-internal: var(--muted); --s-model: var(--muted); --s-tool_output: var(--untrusted); --s-retrieved_doc: var(--untrusted);
    --s-web: var(--untrusted); --s-agent_msg: var(--untrusted); --s-memory: var(--untrusted); --s-unknown: var(--untrusted);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f12; --panel: #14171b; --sunken: #101317; --hover: #1a1e24; --select: #1a2638;
  --line: #262b33; --line-strong: #343a44;
  --text: #e3e6ea; --muted: #9aa3ae; --faint: #8a929d;
  --accent: #5b9bff;
  --ok: #4cc38a; --ok-bg: #11291d; --bad: #ff6b57; --bad-bg: #331512; --warn: #f0b13c; --warn-bg: #2e2210; --untrusted: #fb923c;
  --t-llm: var(--muted); --t-tool: var(--muted); --t-egress: var(--muted); --t-approval: var(--muted); --t-run: #8a929d;
  --s-system: var(--muted); --s-user: var(--muted); --s-internal: var(--muted); --s-model: var(--muted); --s-tool_output: var(--untrusted); --s-retrieved_doc: var(--untrusted);
  --s-web: var(--untrusted); --s-agent_msg: var(--untrusted); --s-memory: var(--untrusted); --s-unknown: var(--untrusted);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans);
  display: grid; grid-template-rows: auto auto auto 1fr auto; height: 100vh; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.label { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }

/* header */
.bar {
  display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 14px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 12px; letter-spacing: .14em; }
.brand svg { color: var(--text); }
.sep { width: 1px; align-self: stretch; margin: 10px 0; background: var(--line); }
select.file {
  height: 26px; min-width: 0; max-width: 320px; padding: 0 8px; border-radius: 3px;
  border: 1px solid var(--line-strong); background: var(--panel); font-family: var(--mono); font-size: 12px;
}
.status {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 3px;
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  border: 1px solid transparent;
}
.status.ok { color: var(--ok); background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.status.bad { color: var(--bad); background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.status.warn { color: var(--warn); background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.verify-meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }

/* stat strip */
.stats { display: flex; gap: 0; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
.stat { padding: 7px 18px 7px 14px; border-right: 1px solid var(--line); white-space: nowrap; }
.stat .v { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat.alert .v { color: var(--warn); }
.stat.danger .v { color: var(--bad); }

/* banners */
.banners:empty { display: none; }
.banner { display: grid; gap: 3px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner summary { cursor: pointer; font-weight: 600; }
.banner ul { margin: 4px 0 2px; padding-left: 18px; }
.banner li { margin: 1px 0; }
.linkish { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; }

/* layout */
.main { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 0; }
.side { border-right: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.section-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.search {
  width: 100%; height: 28px; margin-top: 6px; padding: 0 8px; border-radius: 3px; border: 1px solid var(--line-strong);
  background: var(--sunken); font-family: var(--mono); font-size: 12px;
}
.hits { margin-top: 6px; display: grid; gap: 4px; }
.hit {
  text-align: left; padding: 6px 8px; border-radius: 3px; border: 1px solid var(--line); background: var(--sunken);
  cursor: pointer; display: grid; gap: 1px;
}
.hit:hover { border-color: var(--line-strong); }
.scroll { overflow: auto; min-height: 0; }

/* runs table */
table { border-collapse: collapse; width: 100%; }
.runs th, .tl th {
  position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left;
  font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
  padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.runs td { padding: 6px 7px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.runs { table-layout: auto; }
.runs tr.row { cursor: pointer; }
.runs tr.row:hover td { background: var(--hover); }
.runs tr.sel td { background: var(--select); }
.runs .agent { font-weight: 600; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.num { text-align: right; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); vertical-align: 1px; }
.dot.ok { background: var(--ok); } .dot.error { background: var(--bad); } .dot.running { background: var(--accent); }
.flagcount { color: var(--warn); font-weight: 700; }
.errcount { color: var(--bad); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 1px; display: inline-block; }

/* run detail */
.detail { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; background: var(--panel); }
.run-head { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.run-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.run-title h2 { margin: 0; font-size: 15px; font-weight: 650; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.facts b { color: var(--text); font-weight: 500; font-family: var(--mono); font-size: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-family: var(--mono); font-size: 12px; }
.perms { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.perm { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--sunken); }
.findings { border-bottom: 1px solid var(--line); background: var(--sunken); padding: 8px 14px 6px; }
.findings:empty { display: none; }
.findings-title { color: var(--warn); margin-bottom: 4px; }
.ftable { width: auto; min-width: 60%; }
.ftable th { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 3px 18px 3px 0; }
.ftable td { padding: 3px 18px 3px 0; font-size: 12px; white-space: nowrap; }
.ftable tbody tr { cursor: pointer; }
.ftable tbody tr:hover td { color: var(--accent); }
.ftable .rule { font-family: var(--mono); font-weight: 700; color: var(--warn); }
.rname { margin-left: 8px; font-family: var(--mono); font-weight: 400; color: var(--muted); }

/* timeline table */
.tl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tl tr.ev { cursor: pointer; }
.tl tr.ev:hover td { background: var(--hover); }
.tl tr.open td { background: var(--sunken); }
.tl tr.tampered td { background: var(--bad-bg) !important; }
.tl tr.focus td { animation: focus 1.8s ease-out; }
@keyframes focus { 0% { background: var(--select); } 100% { background: transparent; } }
.tl .seq, .tl .time, .tl .step { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tl .type { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; color: var(--tc, var(--t-run)); }
.tl .detailcell { width: 100%; min-width: 0; }
.headline { font-weight: 550; overflow-wrap: anywhere; }
.sub { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; color: var(--muted); font-size: 12px; }
.tag {
  --c: var(--s-unknown);
  display: inline-flex; align-items: center; gap: 5px; height: 19px; padding: 0 6px; border-radius: 2px;
  border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); color: var(--c); background: var(--panel);
  font-family: var(--mono); font-size: 11px; cursor: default; white-space: nowrap;
}
button.tag { cursor: pointer; }
.tag::before { content: ""; width: 6px; height: 6px; background: var(--c); border-radius: 1px; }
.tag.untrusted { background: color-mix(in srgb, var(--c) 12%, var(--panel)); font-weight: 700; }
.tag[aria-expanded="true"] { outline: 1px solid var(--c); }
.call { font-family: var(--mono); font-size: 11.5px; color: var(--text); }
.flag { display: flex; align-items: center; gap: 0; margin-top: 4px; font-size: 11.5px; color: var(--warn); }
.flag .rname { margin: 0 10px 0 6px; }
.rule-badge { font-family: var(--mono); font-weight: 700; font-size: 11px; padding: 0 5px; border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); border-radius: 2px; background: var(--warn-bg); }
.err { color: var(--bad); font-weight: 600; font-size: 12px; margin-top: 3px; }
.net { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.seal { font-family: var(--mono); font-size: 11px; white-space: nowrap; color: var(--faint); }
.seal.sealed { color: var(--faint); }
.seal.broken { color: var(--bad); font-weight: 700; }
.expand { margin-top: 8px; display: grid; gap: 8px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 10px; font-size: 12px; }
.kv > .k { color: var(--faint); font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding-top: 2px; }
pre.content {
  margin: 0; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
  font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto;
}
.redacted { font-style: italic; color: var(--faint); font-size: 12px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }

/* footer status bar */
.footer {
  display: flex; align-items: center; gap: 14px; height: 24px; padding: 0 12px; border-top: 1px solid var(--line);
  background: var(--panel); color: var(--faint); font-size: 11px; font-family: var(--mono);
}
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; margin-right: 6px; vertical-align: 0; }
.live-dot.on { background: var(--ok); }

@media (max-width: 900px) {
  body { height: auto; overflow: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .scroll { max-height: 320px; }
  .verify-meta { display: none; }
  .bar { flex-wrap: wrap; height: auto; padding: 8px 12px; }
  .tl .time, .tl th.time-h { display: none; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M2 13V3l6 6 6-6v10"/></svg>
    MNESTIQ
  </div>
  <div class="sep"></div>
  <select class="file" id="file" aria-label="Evidence file"></select>
  <span id="verify-badge"></span>
  <span class="verify-meta" id="verify-meta"></span>
  <div class="spacer"></div>
</header>
<section class="stats" id="stats" aria-label="Summary"></section>
<div class="banners" id="banners"></div>
<main class="main">
  <aside class="side">
    <div class="section-head">
      <div class="label">Trace a connection</div>
      <input class="search" id="finder" placeholder="ip:port from a firewall or flow log" autocomplete="off" spellcheck="false" aria-label="Trace a connection">
      <div class="hits" id="hits"></div>
    </div>
    <div class="scroll" id="runs"></div>
    <div class="legend" id="legend"></div>
  </aside>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>
<footer class="footer">
  <span><span class="live-dot" id="live-dot"></span><span id="live-text">connecting</span></span>
  <span id="foot-file"></span>
  <span class="spacer" style="flex:1"></span>
  <span>127.0.0.1 · local only</span>
</footer>

<script>
"use strict";
// Everything from evidence files is attacker-influenced (web pages, tool output),
// so it is only ever inserted as text, never as HTML.
const UNTRUSTED = new Set(["tool_output", "retrieved_doc", "web", "agent_msg", "memory", "unknown"]);
const SOURCES = ["system", "user", "internal", "model", "tool_output", "retrieved_doc", "web", "agent_msg", "memory", "unknown"];
const TRUSTED = new Set(["system", "user", "internal"]);  // values from these are not "introduced by untrusted content"
const TYPE_COLOR = { llm_call: "--t-llm", tool_call: "--t-tool", egress: "--t-egress", approval: "--t-approval" };
// Detection rules. Each names what was observed, not a conclusion: an address taken from a
// web page is consistent with prompt injection, but also with an agent legitimately acting
// on that page. The investigator decides which.
const RULES = {
  "MNQ-001": { name: "untrusted argument", explain: "A tool call's arguments carry an address, URL or account number that appears in untrusted content and not in the user's or system's words." },
  "MNQ-002": { name: "auto-approval", explain: "An action was approved without a human after untrusted content reached the model in this run." },
  "MNQ-003": { name: "egress after taint", explain: "Outbound network connection (not to loopback) after untrusted content reached the model in this run." },
  "MNQ-004": { name: "untrusted sensitive action", explain: "A sensitive action (credentials, permissions, deletion, cancellations, account changes, payments, bookings) ran with an argument value that appears in untrusted content and not in the user's or system's words." },
  "MNQ-005": { name: "untrusted link in answer", explain: "The model's answer carries an image, or a link with data in it, to a host that appears in untrusted content and not in the user's or system's words. An image is fetched as soon as the answer is shown, so it can carry data out without any tool call." },
};
// follow: while the newest file/run is selected, move to newer ones as agents write them.
// MNQ-001: tool-call arguments carrying a destination or identifier (email, URL or host, account
// or long number) that untrusted content introduced. Mirrors mnestiq/findings.py.
const IND_RX = [
  /[A-Za-z0-9_.+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+/g,
  /(?:https?:\/\/|www\.)[^\s"'<>)\]]+|\b[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.(?:com|org|net|io|co|ai|dev|app|info|biz|xyz|me|us|uk|de|eu|ly|gl|link|site|online)\b(?:\/[^\s"'<>)\]]*)?/gi,
  /\b[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}\b/g,
];
const LONG_NUM = /\+?[0-9][0-9 -]{7,}[0-9]/g;
const DATE = /[0-9]{4}-[0-9]{2}-[0-9]{2}/;  // 2024-03-07 is not a number to trace
const SEP = /[ -]/g;
function indicators(text) {
  const found = new Set();
  // Word by word, each cut at 2048 characters: hostile text cannot make the patterns take quadratic time.
  const words = text.split(/\s+/).filter(Boolean).map((w) => w.slice(0, 2048));
  for (const w of words) for (const rx of [IND_RX[0], IND_RX[2]]) for (const m of w.matchAll(rx)) found.add(m[0].toLowerCase().replace(/[.,;:/]+$/, ""));
  // A model may add or drop the scheme or "www." when it copies a link.
  for (const w of words) for (const m of w.matchAll(IND_RX[1])) found.add(m[0].toLowerCase().replace(/^(?:https?:\/\/)?(?:www\.)?/, "").replace(/[.,;:/]+$/, ""));
  for (const m of text.matchAll(LONG_NUM)) if (!DATE.test(m[0])) found.add(m[0].replace(SEP, ""));
  // Keep the longest form: an email's domain or an IBAN's digits are not separate indicators.
  const all = [...found].filter((f) => f.length >= 6);
  return all.filter((f) => !all.some((g) => g !== f && g.includes(f))).sort();
}
const strings = (v) => (v == null ? [] : Array.isArray(v) ? v.flatMap(strings)
  : typeof v === "object" ? Object.values(v).flatMap(strings) : [String(v)]);
function corpus(segs) {
  const text = segs.flatMap((s) => strings(s.content)).join("\n").toLowerCase();
  return { text, compact: text.replace(/(?<=[0-9])[ -](?=[0-9])/g, "") };  // "12 34" is one number, "account 1234" is not
}
const escapeRx = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Whole matches only: "billing@acme.exam" must not count as present in "billing@acme.example".
const inCorpus = (c, ind) => new RegExp(`(?<![a-z0-9_-])${escapeRx(ind)}(?![a-z0-9])`)
  .test(/^[0-9]+$/.test(ind) || ind.startsWith("+") ? c.compact : c.text);
// Loopback traffic never leaves the machine (a local model server, a sidecar): not egress. A request
// for another host sent to a proxy on this machine does leave it.
function loopbackHost(value) {
  const host = String(value || "").replace(/^\[|\]$/g, "").split("%")[0].toLowerCase();
  return host === "localhost" || host === "::1" || /^127\.\d+\.\d+\.\d+$/.test(host);
}
function isLoopback(e) {
  return loopbackHost(e.dest_ip || e.host) && (!e.host || loopbackHost(e.host));
}
// MNQ-004: a sensitive action whose argument values came from untrusted content. Mirrors
// mnestiq/findings.py. Sensitive = marked by the recorder, else guessed from the tool's name.
const SENSITIVE_NAME = /password|passwd|credential|secret|token|api_?key|permission|role|grant|revoke|delete|remove|erase|reset|disable|transfer|refund|payment|send_money|pay_|schedule_transaction|update_scheduled|update_user|update_email|update_account|create_user|reserve|book_|cancel|suspend|deactivate|terminate|close_account|change_|modify_|forward|share_|invite|unsubscribe/i;
const DESTRUCTIVE_NAME = /delete|remove|erase|revoke|disable|cancel|suspend|deactivate|terminate/i;  // a bare id is the whole payload
const NUMBER = /^[+-]?[0-9]+(?:\.[0-9]+)?$/;
const DATE_ONLY = /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/;
const READ_ONLY = /^(get|list|read|search|find|fetch|lookup|query|describe|view|show|check)_/;
function isSensitive(ev, name) {
  const marked = (ev.attributes || {}).sensitive;
  if (typeof marked === "boolean") return marked;
  const snake = (name || "").replace(/(?<=[a-z0-9])(?=[A-Z])/g, "_").toLowerCase();  // sendMoney reads as send_money
  return !READ_ONLY.test(snake) && SENSITIVE_NAME.test(snake);  // reading about an action is not taking it
}

  const table = h("table", { class: "tl" },
    h("thead", {}, h("tr", {}, h("th", {}, "Seq"), h("th", { class: "time-h" }, "Time (UTC)"), h("th", {}, "Step"),
      h("th", {}, "Type"), h("th", {}, "Detail"), h("th", {}, "Seal"))),
    h("tbody", {}, run.events.map((ev) => renderEvent(ev, d))));
  pane.replaceChildren(head, findings, h("div", { class: "scroll", id: "timeline" }, table));
  const tl = document.getElementById("timeline");
  if (state.focusSeq != null) {
    const el = document.getElementById(`ev-${state.focusSeq}`);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("focus"); }
    state.focusSeq = null;
  } else {
    tl.scrollTop = scroll;
  }
}

function renderEvent(ev, d) {
  const errors = d.errBySeq.get(ev.seq) || [];
  const sealed = d.sealed(ev.seq);
  const key = String(ev.seq);
  const open = state.open.has(key);
  const t = ev.event_type;
  let headline = "";
  const sub = [];
  const more = [];

  if (t === "llm_call") {
    const m = ev.model || {};
    headline = m.version || m.name || "model";
    sub.push(...(ev.context || []).map((seg, i) => segTag(ev, seg, i)));
    if (ev.tool_calls?.length) sub.push(h("span", {}, "→"), ...ev.tool_calls.map((tc) => h("span", { class: "call" }, `${tc.name}(${argsPreview(tc.arguments)})`)));
    (ev.context || []).forEach((seg, i) => { if (state.open.has(`${ev.seq}:c${i}`)) more.push(kv(`${seg.source}${seg.name ? " · " + seg.name : ""}`, content(seg.content, seg.content_hash, "content"))); });
    if (open) {
      if (ev.output) more.push(kv("Model output", content(ev.output.content, ev.output.content_hash, "content")));
      if (ev.usage) more.push(kv("Usage", `${ev.usage.input_tokens ?? "?"} in · ${ev.usage.output_tokens ?? "?"} out tokens${ev.latency_ms != null ? ` · ${ev.latency_ms} ms` : ""}`));
    }
  } else if (t === "tool_call") {
    const tc = (ev.tool_calls || [])[0] || {};
    const src = tc.result_source || "tool_output";
    headline = tc.name || "tool";
    sub.push(h("span", { class: "call" }, `${tc.name}(${argsPreview(tc.arguments)})`), h("span", {}, "→ result"),
      // src comes from the file: only a known source name may reach the style attribute.
      h("span", { class: `tag${UNTRUSTED.has(src) ? " untrusted" : ""}`, style: `--c:var(--s-${SOURCES.includes(src) ? src : "unknown"})` }, src),
      tc.latency_ms != null ? h("span", { class: "faint mono" }, `${tc.latency_ms} ms`) : null);
    if (tc.error) sub.push(h("span", { class: "err" }, tc.error));
    if (open) {
      more.push(kv("Arguments", content(tc.arguments, tc.arguments_hash, "arguments")));
      if ("result" in tc || tc.result_hash) more.push(kv("Result", content(tc.result, tc.result_hash, "result")));
    }
  } else if (t === "egress") {
    const e = (ev.egress || [])[0] || {};
    headline = e.protocol === "http" ? `${e.method} ${e.host || ""}${e.status ? " " + e.status : ""}` : `TCP ${e.host || e.dest_ip || ""}:${e.dest_port ?? ""}`;
    sub.push(h("span", { class: "net" }, `${addr(e.source_ip, e.source_port)} → ${addr(e.dest_ip, e.dest_port)}`));
    if (e.url) sub.push(h("span", { class: "net" }, e.url));
    if (e.error) sub.push(h("span", { class: "err" }, e.error));
    if (open) more.push(kv("Egress id", h("span", { class: "mono" }, e.egress_id || "-")),
      kv("Run id header", e.run_id_header ? "sent" : "not sent"), kv("Public ip", e.public_ip || "-"));
  } else if (t === "approval") {
    const a = (ev.approvals || [])[0] || {};
    headline = `${a.action}: ${a.decision}`;
    sub.push(h("span", {}, `by ${a.approver} (${a.approver_type || "?"})`), a.reason ? h("span", { class: "faint" }, a.reason) : null);
  } else if (t === "run_start") {
    headline = ev.parent_run_id ? "sub-run started" : "run started";
  } else if (t === "run_end") {
    headline = `run ended · ${ev.status}`;
    if (ev.error) sub.push(h("span", { class: "err" }, ev.error));
  } else {
    headline = ev.attributes?.message || t;
  }
  if (ev.error && t !== "run_end" && t !== "tool_call") sub.push(h("span", { class: "err" }, ev.error));
  if (open) for (const f of ev._flags) more.push(kv(f.rule, `${RULES[f.rule].explain}${f.rule === "MNQ-001" ? "" : ` Untrusted content first reached the model at step ${f.taint}.`}`));
  if (open) more.push(h("details", {}, h("summary", { class: "label", style: "cursor:pointer" }, "Raw record"),
    h("pre", { class: "content" }, JSON.stringify(ev, (k, v) => (k.startsWith("_") ? undefined : v), 2))));

  const seal = errors.length ? h("span", { class: "seal broken", title: "record no longer matches what was signed" }, "BROKEN")
    : sealed === "failed" ? h("span", { class: "seal broken", title: "the checkpoint covering this record does not verify" }, "SEAL FAILS")
    : h("span", { class: `seal${sealed ? " sealed" : ""}`, title: sealed ? "covered by a signed checkpoint" : "not yet covered by a signed checkpoint" }, sealed ? "sealed" : "pending");
  return h("tr", {
      class: `ev${open ? " open" : ""}${errors.length ? " tampered" : ""}${ev._flags.length ? " flagged" : ""}`,
      id: `ev-${ev.seq}`, style: `--tc:var(${TYPE_COLOR[t] || "--t-run"})`,
      onclick: (e) => { if (e.target.closest("button, a, pre, details")) return; toggle(key); },
    },
    h("td", { class: "seq" }, ev.seq),
    h("td", { class: "time" }, clock(ev.ts)),
    h("td", { class: "step" }, ev.step_id ?? "-"),
    h("td", { class: "type" }, t.replace("_", " ")),
    h("td", { class: "detailcell" },
      h("div", { class: "headline" }, headline),
      sub.length ? h("div", { class: "sub" }, sub) : null,
      ...ev._flags.map((f) => h("div", { class: "flag", title: RULES[f.rule].explain },
        h("span", { class: "rule-badge" }, f.rule), h("span", { class: "rname" }, RULES[f.rule].name), h("span", { class: "mono" }, f.finding))),
      ...errors.map((e) => h("div", { class: "err" }, `ALTERED ${e.code}: ${e.message}`)),
      more.length ? h("div", { class: "expand" }, more) : null),
    h("td", {}, seal));
}

function kv(k, v) { return h("div", { class: "kv" }, h("div", { class: "k" }, k), h("div", {}, v)); }

function segTag(ev, seg, i) {
  const key = `${ev.seq}:c${i}`;
  const open = state.open.has(key);
  const label = seg.name ? `${seg.source}·${seg.name}` : seg.source;
  return h("button", {
    class: `tag${UNTRUSTED.has(seg.source) ? " untrusted" : ""}`, style: `--c:var(--s-${SOURCES.includes(seg.source) ? seg.source : "unknown"})`,
    "aria-expanded": String(open), title: UNTRUSTED.has(seg.source) ? "untrusted input: click to view" : "click to view",
    onclick: () => toggle(key),
  }, label);
}

function toggle(key) {
  state.open.has(key) ? state.open.delete(key) : state.open.add(key);
  renderDetail(state.data);
}

function content(value, hash, field) {
  if (value === undefined) return h("div", { class: "redacted" }, `${field} not present (redacted or omitted); committed hash ${hash || "?"}`);
  return h("pre", { class: "content" }, fmt(value));
}

function argsPreview(args) {
  if (args === undefined) return "redacted";
  const s = typeof args === "string" ? args : JSON.stringify(args);
  return s.length > 70 ? s.slice(0, 67) + "…" : s;
}

// ---------- connection finder ----------
function renderFinder() {
  const q = document.getElementById("finder").value.trim();
  const box = document.getElementById("hits");
  if (!q || !state.data) { box.replaceChildren(); return; }
  const port = /^\d+$/.test(q) ? Number(q) : null;
  const hits = state.data.egress.filter((r) => {
    const e = (r.egress || [])[0] || {};
    if (port != null) return e.source_port === port || e.dest_port === port;
    return addr(e.source_ip, e.source_port) === q || addr(e.dest_ip, e.dest_port) === q || (e.url || "").includes(q) || (e.host || "").includes(q);
  }).slice(0, 20);
  box.replaceChildren(...(hits.length ? hits.map((r) => {
    const e = r.egress[0];
    return h("button", { class: "hit", onclick: () => focusSeq(r.seq) },
      h("span", { class: "mono" }, `${addr(e.source_ip, e.source_port)} → ${addr(e.dest_ip, e.dest_port)}`),
      h("span", { class: "muted", style: "font-size:12px" }, `${r.agent_id} · run ${short(r.run_id)} · step ${r.step_id} · ${clock(r.ts)}`));
  }) : [h("div", { class: "faint", style: "font-size:12px" }, "No recorded connection matches.")]));
}

function focusSeq(seq) {
  const rec = state.data.records.find((r) => r.seq === seq);
  if (rec?.run_id) state.runId = rec.run_id;
  state.follow.run = false;
  state.focusSeq = seq;
  state.open.add(String(seq));
  render();
}

document.getElementById("finder").addEventListener("input", () => { renderFinder(); writeHash(); });
document.getElementById("file").addEventListener("change", (e) => {
  state.name = e.target.value; state.etag = null; state.runId = null; state.open.clear();
  state.follow = { file: state.name === state.files[0]?.name, run: true };
  tick();
});
readHash();
tick();
</script>
</body>
</html>
