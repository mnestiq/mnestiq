[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mnestiq"
version = "0.1.1"
description = "Tamper-evident flight recorder for AI agents: hash-chained, signed evidence logs with provenance-tagged context."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Mnestiq" }]
keywords = ["ai-agents", "llm", "security", "forensics", "incident-response", "audit-log", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "cryptography>=42",
    "jsonschema>=4.18",
]

[project.urls]
Homepage = "https://mnestiq.com"
Repository = "https://github.com/mnestiq/mnestiq"
Issues = "https://github.com/mnestiq/mnestiq/issues"
Specification = "https://github.com/mnestiq/mnestiq/blob/main/spec/SPEC.md"
Changelog = "https://github.com/mnestiq/mnestiq/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
azure = ["azure-keyvault-keys>=4.9", "azure-identity>=1.17"]
timestamps = ["rfc3161-client>=1.0.3"]
dev = ["pytest>=8"]

[project.scripts]
mnestiq = "mnestiq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnestiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
# SIM117: nested `with` reads better in tests that assert on the outer context.
ignore = ["SIM117"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
