name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,anthropic,openai,azure,timestamps]" httpx requests ruff mypy
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy src
      - name: Tests (network beyond loopback is blocked by tests/_netguard.py)
        run: python -m pytest -q
      - name: Schema copy in sync with spec
        shell: bash
        run: cmp ../spec/schema/record.schema.json src/mnestiq/schema/record.schema.json

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "./python[anthropic,openai,azure,timestamps]" pip-audit
      - name: Known vulnerabilities in dependencies
        run: pip-audit --skip-editable
