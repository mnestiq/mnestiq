name: release

# Runs when a GitHub release is published. Uploads to PyPI with Trusted Publishing, which
# also attaches PyPI's publish attestations. The build gets a GitHub build-provenance
# attestation too: `gh attestation verify <file> --repo mnestiq/mnestiq` checks a download
# was built here, from this workflow, at the release's commit.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The tests install many packages from PyPI and run their code: they get no signing rights.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e ".[dev,anthropic,openai,azure,timestamps]" httpx requests
          python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # to sign the provenance attestation
      attestations: write  # to store it
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
      - name: Changelog has a dated entry for this version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" ../CHANGELOG.md; then
            echo "CHANGELOG.md has no dated heading for ${version}, such as: ## ${version} (YYYY-MM-DD)"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: python/dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mnestiq
    permissions:
      id-token: write  # for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3